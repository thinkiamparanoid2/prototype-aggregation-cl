name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest  # benchmark_environment and its tests model a Windows workstation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest ssl_hdc_pilot/tests tests -q
      - run: python scripts/make_tables.py
      - run: python scripts/session_audit.py overlap audit/session_keys.csv ssl_hdc_pilot/trusted_splits
